<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; padding: 2rem; }
    #chatbox { width: 100%; max-width: 600px; margin: auto; background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
    .message { margin: 0.5rem 0; }
    .user { text-align: right; }
    .bot { text-align: left; color: #444; }
    input[type="text"] { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="chatbox">
    <div id="messages"></div>
    <input id="input" type="text" placeholder="Ask me anything..." />
  </div>
  <script src="bot.js"></script>
</body>
</html>
